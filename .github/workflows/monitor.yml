name: Controllo Alert Protezione Civile

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  check-alerts:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: pip install requests

      - name: Esegui lo script di controllo
        run: python check_alerts.py

      - name: Salva lo stato aggiornato (Commit)
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          # Crea il file se non esiste (così evitiamo l'errore)
          touch stato_precedente.json
          git add stato_precedente.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aggiornamento stato allerte" && git push)
