name: Controllo Alert Protezione Civile

on:
  schedule:
    # Esegue ogni 30 minuti
    - cron: '*/30 * * * *'
  workflow_dispatch: # Permette l'avvio manuale dal tab Actions

jobs:
  check-alerts:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necessario per salvare lo stato nel repo

    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Lasciamo 3.10 che va benissimo

      - name: Installa dipendenze
        run: pip install requests aiodpc # Aggiunto aiodpc qui

      - name: Esegui lo script di controllo
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python check_alerts.py

      - name: Salva lo stato aggiornato (Commit)
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add stato_precedente.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aggiornamento stato allerte" && git push)
