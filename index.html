<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iscrizione Allerte Protezione Civile</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 2rem auto; padding: 0 1rem; }
        label { display: block; margin-top: 1rem; font-weight: bold; }
        select, input, button { width: 100%; padding: 0.5rem; margin-top: 0.3rem; box-sizing: border-box; }
        button { margin-top: 1.5rem; background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        #messaggio { margin-top: 1rem; padding: 1rem; border-radius: 4px; }
        .successo { background: #d4edda; color: #155724; }
        .errore { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h2>Iscriviti agli avvisi della Protezione Civile</h2>
    <p>Scegli il tuo comune e ricevi notifiche push tramite ntfy.</p>

    <label for="ntfy">Il tuo topic ntfy (es. <code>allerte-mario-x7k2</code>)</label>
    <input type="text" id="ntfy" placeholder="Scegli un nome univoco e difficile da indovinare" required>

    <label for="regione">Regione</label>
    <select id="regione" required><option value="">Caricamento...</option></select>

    <label for="provincia">Provincia</label>
    <select id="provincia" disabled required><option value="">Scegli prima la regione</option></select>

    <label for="comune">Comune</label>
    <select id="comune" disabled required><option value="">Scegli prima la provincia</option></select>

    <button onclick="iscriviti()">Iscriviti</button>
    <div id="messaggio"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script>
        // === SOSTITUISCI CON I TUOI DATI ===
        const SUPABASE_URL = 'https://pkaygmgqdbnajsfjjwxj.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_f66hmlBUBDmNrrWk64_vSQ_6PqNr5kZ';
        // ===================================

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const API_BASE = 'https://allertameteo.app/api';

        const regioneSelect = document.getElementById('regione');
        const provinciaSelect = document.getElementById('provincia');
        const comuneSelect = document.getElementById('comune');
        const messaggioDiv = document.getElementById('messaggio');

        async function caricaRegioni() {
            try {
                const res = await fetch(`${API_BASE}/regioni`);
                const regioni = await res.json();
                regioneSelect.innerHTML = '<option value="">Scegli una regione</option>';
                regioni.forEach(r => {
                    regioneSelect.innerHTML += `<option value="${r.nome || r}">${r.nome || r}</option>`;
                });
            } catch (e) {
                regioneSelect.innerHTML = '<option value="">Errore nel caricamento</option>';
            }
        }

        regioneSelect.addEventListener('change', async () => {
            provinciaSelect.disabled = true;
            comuneSelect.disabled = true;
            comuneSelect.innerHTML = '<option value="">Scegli prima la provincia</option>';
            if (!regioneSelect.value) return;

            try {
                const res = await fetch(`${API_BASE}/province?regione=${encodeURIComponent(regioneSelect.value)}`);
                const province = await res.json();
                provinciaSelect.innerHTML = '<option value="">Scegli una provincia</option>';
                province.forEach(p => {
                    provinciaSelect.innerHTML += `<option value="${p.nome || p}">${p.nome || p}</option>`;
                });
                provinciaSelect.disabled = false;
            } catch (e) {
                provinciaSelect.innerHTML = '<option value="">Errore</option>';
            }
        });

        provinciaSelect.addEventListener('change', async () => {
            comuneSelect.disabled = true;
            if (!provinciaSelect.value) return;

            try {
                const res = await fetch(`${API_BASE}/comuni?provincia=${encodeURIComponent(provinciaSelect.value)}`);
                const comuni = await res.json();
                comuneSelect.innerHTML = '<option value="">Scegli un comune</option>';
                comuni.forEach(c => {
                    comuneSelect.innerHTML += `<option value="${c.nome || c}">${c.nome || c}</option>`;
                });
                comuneSelect.disabled = false;
            } catch (e) {
                comuneSelect.innerHTML = '<option value="">Errore</option>';
            }
        });

        async function iscriviti() {
            const topic = document.getElementById('ntfy').value.trim();
            const comune = comuneSelect.value;

            if (!topic || !comune) {
                mostraMessaggio('Compila tutti i campi.', 'errore');
                return;
            }

            const { error } = await supabaseClient
                .from('iscrizioni')
                .insert([{ ntfy_topic: topic, comune: comune }]);

            if (error) {
                mostraMessaggio('Errore: ' + error.message, 'errore');
            } else {
                mostraMessaggio(`Iscrizione avvenuta! Riceverai notifiche per <b>${comune}</b>.<br>Iscriviti al topic <code>${topic}</code> sull'app ntfy.`, 'successo');
            }
        }

        function mostraMessaggio(testo, classe) {
            messaggioDiv.innerHTML = testo;
            messaggioDiv.className = classe;
        }

        caricaRegioni();
    </script>
</body>
</html>
